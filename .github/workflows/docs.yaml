name: docs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [next, qa, main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          manifest-path: pyproject.toml
          # Workaround: Dynamic versioning (versioningit) causes lock file version mismatch.
          # We skip the editable package install and do it separately with pip.
          # See: https://github.com/prefix-dev/pixi/pull/3092
          run-install: false
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt-get install -y graphviz
      - name: Build documentation
        run: |
          pixi run --environment docs build-docs
      - name: Check for warnings and errors
        run: |
          # Ensure build completed without warnings or errors
          BUILD_OUTPUT=$(pixi run --environment docs build-docs 2>&1)
          if echo "$BUILD_OUTPUT" | grep -i "warning\|error\|failed"; then
            echo "Documentation build contains warnings or errors:"
            echo "$BUILD_OUTPUT" | grep -i "warning\|error\|failed"
            exit 1
          else
            echo "Documentation build completed without warnings or errors"
          fi
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: docs/_build/
          retention-days: 30
